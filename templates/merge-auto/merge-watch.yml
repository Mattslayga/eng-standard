# Every 10 minutes: a PR whose required check is red or missing with no activity for merge.auto.stuck_minutes gets the
# `stuck` label; a FAIL or missing verdict restarts the owning job (POST to the ENG_RESTART_WEBHOOK secret, plus a comment).
name: merge-watch
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
concurrency:
  group: merge-watch
  cancel-in-progress: false
permissions:
  contents: write                   # update-branch for behind PRs with auto-merge on (strict mode): a merge from main, never a force push
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: write                    # dispatch merge-post.yml when a bot-armed merge fired no push run
jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: node bin/eng.mjs merge watch
        env:
          GH_TOKEN: ${{ github.token }}
          ENG_RESTART_WEBHOOK: ${{ secrets.ENG_RESTART_WEBHOOK }}
