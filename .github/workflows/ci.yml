name: ci
on:
  pull_request:
  push:
    branches: [main]
  # self-merge.yml dispatches this on main after each merge: a GITHUB_TOKEN merge fires no push event.
  workflow_dispatch:
# One run per workflow+ref. Superseded PR runs are cancelled; main runs never are (post-merge backstop).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: node bin/eng.mjs --help
