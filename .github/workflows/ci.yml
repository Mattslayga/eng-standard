# The ONE required check (merge rule v0.10.0, AGENTS.md): job `test` = tests + the merge gate, on pull_request, on
# merge_group (queue mode, where the repo has one) and on dispatch for auto-reverts. The gate runs main's code and main's eng.config.yml, so a PR cannot pass its own gate by editing it.
name: ci
on:
  pull_request:
  merge_group:
  workflow_dispatch:                # eng merge post dispatches this on an auto-revert branch (a GITHUB_TOKEN PR starts no workflows)
    inputs:
      pr:
        description: PR number this run checks
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: node bin/eng.mjs --help
      - name: merge gate (independent verdict for this exact patch-id)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main
          git worktree add -q "$RUNNER_TEMP/base" origin/main
          (cd "$RUNNER_TEMP/base" && npm ci --ignore-scripts --silent)
          if node "$RUNNER_TEMP/base/bin/eng.mjs" merge 2>&1 | grep -q 'usage: eng merge gate'; then
            node "$RUNNER_TEMP/base/bin/eng.mjs" merge gate --config-from origin/main
          else
            echo "BOOTSTRAP: origin/main has no merge gate yet, so this runs the PR's own gate. Only the PR that adds the gate takes this path."
            node bin/eng.mjs merge gate
          fi
