# Labels every PR into main risk:high or risk:low from its changed paths (eng.config.yml ship.high_risk).
# pull_request_target + checkout of main: the classifier is always main's code, never the PR's, so a PR cannot
# relabel itself by editing the rules. Nothing from the PR is checked out or run.
name: risk-label
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]   # edited covers a retarget to main
permissions: {}
concurrency:
  group: risk-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  label:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write          # add / remove the risk label
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: node scripts/pr-gate.mjs label "$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
