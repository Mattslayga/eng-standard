# The ONE required check, eng-merge-gate (merge rule v0.10.0, AGENTS.md). Trusted: pull_request_target, workflow_run,
# issue_comment and workflow_dispatch all run main's copy of this file and main's code; the PR's commits are only read as
# data. It waits for the PR's `test` check, applies eng merge gate (strict: an independent PASS for the exact head), and posts
# eng-merge-gate as a commit status on the PR head.
name: gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  workflow_run:
    workflows: [ci]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to gate
        required: true
concurrency:
  group: gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  statuses: write
jobs:
  eng-merge-gate:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '<!-- eng-verdict/v1 -->'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - name: eng merge gate (main's code; the PR is data)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr }}
        run: |
          [ -n "$PR_NUMBER" ] || { echo "not about a PR"; exit 0; }
          git fetch -q origin "pull/$PR_NUMBER/head"
          node bin/eng.mjs merge gate --post-status --pr "$PR_NUMBER"
