# Squash-merges at most ONE risk:low PR into main per run, only when every rule in lib/self-merge.mjs holds on the
# current head SHA (test green, verdict success, no hold label, green for ship.self_merge.hold_minutes). risk:high
# waits for Matt. Then dispatches ci.yml on main (a GITHUB_TOKEN merge fires no push workflow). Rules: AGENTS.md.
# Stop one PR: add the `hold` label. Stop everything: gh workflow disable self-merge.yml
name: self-merge
on:
  schedule:
    - cron: '7,37 * * * *'          # every 30 min, off the hour (GitHub delays top-of-hour schedules)
  workflow_dispatch:
    inputs:
      pr:
        description: Only consider this PR number (every rule still applies; the hold window cannot be shortened)
        required: false
        default: ''
      dry_run:
        description: Report only, merge nothing
        type: boolean
        default: false
permissions: {}
concurrency:
  group: self-merge
  cancel-in-progress: false
jobs:
  self-merge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write               # squash-merge through the API and delete the merged head branch
      pull-requests: read
      checks: read                  # the test check run on the head SHA
      statuses: read                # the verdict commit status on the head SHA
      actions: write                # dispatch ci.yml on main after the merge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: node scripts/pr-gate.mjs merge ${DRY_RUN:+--dry-run}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
